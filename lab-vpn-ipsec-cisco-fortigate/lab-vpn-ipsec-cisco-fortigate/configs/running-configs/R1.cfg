! R1 (hostname CISCO-SRV) - Router de usuarios: WAN, router-on-a-stick, DHCP, VPN IPsec y NAT
! Credenciales y PSK sustituidos por marcadores. Reemplazar antes de usar.
enable
configure terminal
hostname CISCO-SRV
no ip domain-lookup

banner motd # [NOMBRE] [MATRICULA] | EL ACCESO NO AUTORIZADO ESTA RESTRINGIDO #

username Admin privilege 15 secret <ADMIN_PASSWORD>
service password-encryption
enable secret <ENABLE_PASSWORD>

ip domain-name redlocal.com
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

line console 0
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
 logging synchronous
!
! ===== WAN =====
interface g1/0
 description WAN-ISP
 ip address 20.25.6.2 255.255.255.252
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 20.25.6.1
!
! ===== LAN: VLAN 10 (subinterfaz) =====
interface g2/0
 description LAN-USUARIOS
 no shutdown
!
interface g2/0.10
 description VLAN10-USUARIOS
 encapsulation dot1Q 10
 ip address 10.25.6.1 255.255.255.128
!
! ===== DHCP =====
ip dhcp excluded-address 10.25.6.1 10.25.6.9
ip dhcp excluded-address 10.25.6.101 10.25.6.126
ip dhcp pool USUARIOS
 network 10.25.6.0 255.255.255.128
 default-router 10.25.6.1
 dns-server 8.8.8.8
!
! ===== VPN IPsec: FASE 1 (IKEv1) =====
crypto isakmp policy 10
 encryption des
 hash sha
 authentication pre-share
 group 14
 lifetime 86400
!
crypto isakmp key <PSK_VPN> address 20.25.97.2
!
! ===== VPN IPsec: FASE 2 =====
crypto ipsec transform-set TS esp-des esp-sha-hmac
 mode tunnel
!
ip access-list extended VPN-TRAFFIC
 permit ip 10.25.6.0 0.0.0.127 10.25.97.0 0.0.0.15
!
crypto map CMAP 10 ipsec-isakmp
 set peer 20.25.97.2
 set transform-set TS
 match address VPN-TRAFFIC
!
interface g1/0
 crypto map CMAP
!
! ===== NAT (salida a Internet, excluyendo tráfico VPN) =====
ip access-list extended NAT-ACL
 deny   ip 10.25.6.0 0.0.0.127 10.25.97.0 0.0.0.15
 permit ip 10.25.6.0 0.0.0.127 any
!
ip nat inside source list NAT-ACL interface g1/0 overload
interface g1/0
 ip nat outside
interface g2/0.10
 ip nat inside
!
end
write memory
