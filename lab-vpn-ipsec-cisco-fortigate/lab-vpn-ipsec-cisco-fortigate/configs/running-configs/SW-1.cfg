! SW-1 - Switch de acceso (VLAN 10)
! Credenciales sustituidas por marcadores. Reemplazar antes de usar.
enable
configure terminal
hostname SW-1
no ip domain-lookup

banner motd # [NOMBRE] [MATRICULA] | EL ACCESO NO AUTORIZADO ESTA RESTRINGIDO #

username Admin privilege 15 secret <ADMIN_PASSWORD>
service password-encryption
enable secret <ENABLE_PASSWORD>

ip domain-name redlocal.com
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

line console 0
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
 logging synchronous
!
vlan 10
 exit
interface gigabit 0/1
 description HACIA-PC1
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface gigabit 0/0
 description TRUNK-HACIA-R1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
!
end
write memory
