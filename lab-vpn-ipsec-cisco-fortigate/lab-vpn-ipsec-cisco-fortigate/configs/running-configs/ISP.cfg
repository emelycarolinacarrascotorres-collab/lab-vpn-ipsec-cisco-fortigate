! ISP - Router de tránsito (sin NAT ni rutas: ambas redes WAN están directamente conectadas)
! Credenciales sustituidas por marcadores. Reemplazar antes de usar.
enable
configure terminal
hostname ISP
no ip domain-lookup

banner motd # [NOMBRE] [MATRICULA] | EL ACCESO NO AUTORIZADO ESTA RESTRINGIDO #

username Admin privilege 15 secret <ADMIN_PASSWORD>
service password-encryption
enable secret <ENABLE_PASSWORD>

ip domain-name redlocal.com
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

line console 0
 exec-timeout 5 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
 logging synchronous
!
interface g1/0
 description HACIA-CISCO-USR
 ip address 20.25.6.1 255.255.255.252
 no shutdown
!
interface g2/0
 description HACIA-FORTIGATE
 ip address 20.25.97.1 255.255.255.252
 no shutdown
!
end
write memory
